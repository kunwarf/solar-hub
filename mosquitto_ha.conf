# Mosquitto configuration for Home Assistant integration broker
# Port 1884 (separate from main broker on 1883)
# Requires authentication — no anonymous access

# -----------------------------------------------------------------
# Listener settings
# -----------------------------------------------------------------
listener 1884
protocol mqtt

# WebSocket listener (optional — enable when you need browser-based HA)
# listener 9002
# protocol websockets

# -----------------------------------------------------------------
# Authentication — deny everything unless credentials match
# -----------------------------------------------------------------
allow_anonymous false

# Dynamic Security Plugin manages per-user accounts and ACLs.
# The JSON file is generated on first run by mosquitto_ha_init service.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# -----------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------
# Logging
# -----------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto_ha.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# -----------------------------------------------------------------
# Performance
# -----------------------------------------------------------------
max_connections 500
message_size_limit 65536
