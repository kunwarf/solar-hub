# Device Communication Protocols Configuration
# ==============================================
# Defines protocols for identifying and communicating with solar devices.
# Protocols are tried in priority order (lower number = higher priority).

protocols:
  # ============================================
  # INVERTERS
  # ============================================

  - id: powdrive
    name: "Powdrive Hybrid Inverter"
    description: "Powdrive 12K and similar hybrid inverters"
    device_type: inverter
    protocol_type: modbus_tcp
    priority: 2
    manufacturer: "Powdrive"
    model_pattern: "^(12K|15K|20K).*"
    register_map: "powdrive_registers.json"
    adapter_class: "adapters.powdrive.PowdriveAdapter"

    identification:
      # Read inverter type register
      register: 0
      size: 1
      expected_values: [2, 3, 4, 5]  # 2=Inverter, 3=Hybrid, 4=Micro, 5=3Phase Hybrid
      timeout: 2.0

    serial_number:
      register: 3
      size: 5
      encoding: ascii

    polling:
      default_interval: 10
      timeout: 5.0
      max_consecutive_failures: 5

    modbus:
      unit_id: 1
      timeout: 5.0
      retries: 3

    telemetry:
      # Powdrive uses negative values for charging
      battery_power_sign_convention: "negative_charging"
      # Deye/Powdrive spec explicitly states "low word at lower address" for U32 registers
      u32_word_order: "little_endian"

  - id: senergy
    name: "Senergy Hybrid Inverter"
    description: "Senergy series hybrid inverters"
    device_type: inverter
    protocol_type: modbus_tcp
    priority: 1
    manufacturer: "Senergy"
    register_map: "senergy_registers.json"
    adapter_class: "adapters.senergy.SenergyAdapter"

    identification:
      # Inverter Mode at 0x101D (4125) — in the core real-time data block (0x1010+)
      # which all Senergy firmware versions must support.
      # Enum: 0=Initial, 1=Standby, 3=OnGrid, 4=OffGrid, 5=Fault (2 is absent).
      register: 4125
      size: 1
      expected_values: [0, 1, 3, 4, 5]
      # Reject if register 0 returns a Powdrive inverter-type value.
      # Powdrive devices that return 0 for unknown register 4125 would otherwise
      # be mis-identified as Senergy. This guard reads register 0 and rejects
      # the probe if the value is in the Powdrive identification range.
      reject_register: 0
      reject_values: [2, 3, 4, 5]
      # 8s: allows time for probe reg (4125) + reject check (reg 0) + serial read (6672×8)
      timeout: 8.0

    serial_number:
      # Device Serial Number at 0x1A10 = 6672, 8 registers, ASCII
      register: 6672
      size: 8
      encoding: ascii

    polling:
      default_interval: 10
      timeout: 5.0
      max_consecutive_failures: 5

    modbus:
      unit_id: 1
      timeout: 5.0
      retries: 3

    telemetry:
      # Senergy uses standard convention: positive = charging
      battery_power_sign_convention: "positive_charging"

  # ============================================
  # ENERGY METERS
  # ============================================

  - id: iammeter
    name: "IAMMeter Grid Meter"
    description: "IAMMeter WEM3080, WEM3080T, WEM3046T energy meters"
    device_type: meter
    protocol_type: modbus_tcp
    priority: 10
    manufacturer: "Iammeter"
    model_pattern: "^WEM3(080|046)T?$"
    register_map: "iammeter_registers.json"
    adapter_class: "adapters.iammeter.IAMMeterAdapter"

    identification:
      # Device model register: 1=WEM3080, 2=WEM3080T, 3=WEM3046T, 4=WEM3050T
      register: 9
      size: 1
      expected_values: [1, 2, 3, 4]
      timeout: 2.0

    serial_number:
      register: 56
      size: 8
      encoding: ascii

    polling:
      default_interval: 5
      timeout: 5.0
      max_consecutive_failures: 5

    modbus:
      unit_id: 1
      timeout: 5.0
      retries: 3

  # ============================================
  # BATTERIES
  # ============================================

  - id: pylontech
    name: "Pylontech Battery"
    description: "Pylontech LFP battery modules (US2000, US3000, UP5000, FORCE series)"
    device_type: battery
    protocol_type: command
    priority: 19
    manufacturer: "Pylontech"
    register_map: "pytes_registers.json"
    adapter_class: "adapters.battery_pytes.PytesBatteryAdapter"

    identification:
      # Serial console 'info' command; response contains "Pylon" manufacturer
      command: "info"
      expected_response: "Pylon"
      timeout: 5.0

    serial_number:
      # Barcode field from 'info' response is the serial number
      command: "info"
      parse_regex: "Barcode\\s*:\\s*([A-Z0-9]+)"

    polling:
      # 60s gives headroom for 10-module stacks:
      # wake-up + pwr + 10×(bat N) = 12 commands × ~3s typical = ~36s
      default_interval: 60
      timeout: 90.0
      max_consecutive_failures: 5

    command:
      line_ending: "\r\n"
      response_timeout: 5.0
      command_delay: 0.2

  - id: pytes
    name: "Pytes Battery"
    description: "Pytes LFP battery modules (compatible with Pylontech protocol)"
    device_type: battery
    protocol_type: command
    priority: 20
    manufacturer: "Pytes"
    register_map: "pytes_registers.json"
    adapter_class: "adapters.battery_pytes.PytesBatteryAdapter"

    identification:
      # Command-based identification
      command: "info"
      expected_response: "Pytes"
      timeout: 5.0

    serial_number:
      command: "info"
      parse_regex: "Barcode\\s*:\\s*([A-Z0-9]+)"

    polling:
      default_interval: 60
      timeout: 90.0
      max_consecutive_failures: 5

    command:
      line_ending: "\r\n"
      response_timeout: 5.0
      command_delay: 0.2

  - id: jkbms_modbus
    name: "JK-BMS (Modbus RTU)"
    description: "JK Battery Management System via Modbus RTU over RS485 (passive slave mode)"
    device_type: battery
    protocol_type: modbus_tcp
    priority: 18
    manufacturer: "JK"
    register_map: "jkbms_modbus_registers.json"

    identification:
      # Read cell 1 voltage (register 0). For a healthy LiFePO4 cell this
      # will be ~2800-4200 mV — any valid non-exception response identifies JK BMS.
      # Powdrive (priority 1) checks register 0 for values [2,3,4,5], so a cell
      # voltage of ~3000+ mV will never match those and powdrive probe fails first.
      register: 0
      size: 1
      match_any: true
      timeout: 5.0

    serial_number:
      # JK BMS has no standard Modbus serial-number register.
      # Falls back to IP:port-based serial generated by the prober.
      register: null

    polling:
      default_interval: 10
      timeout: 10.0
      max_consecutive_failures: 5

    modbus:
      unit_id: 1
      timeout: 5.0
      retries: 3

  - id: jkbms_serial
    name: "JK-BMS (Serial Bridge)"
    description: "JK Battery Management System via ESP32 serial bridge (RS485 passive broadcast)"
    device_type: battery
    protocol_type: command
    priority: 22
    manufacturer: "JK"

    identification:
      # Serial bridge path: identified from HELLO frame, no probing needed
      command: ""
      expected_response: ""
      timeout: 5.0

    polling:
      default_interval: 10
      timeout: 5.0
      max_consecutive_failures: 5

    command:
      line_ending: ""
      response_timeout: 5.0
      command_delay: 0.0

  - id: jkbms_tcp
    name: "JK-BMS (TCP)"
    description: "JK Battery Management System over TCP"
    device_type: battery
    protocol_type: command
    priority: 21
    manufacturer: "JK"
    adapter_class: "adapters.battery_jkbms_tcpip.JKBMSTCPAdapter"

    identification:
      command: "\x4E\x57"  # JK-BMS request header
      expected_response: "\x4E\x57"  # JK-BMS response header
      timeout: 5.0

    serial_number:
      command: "sn"
      parse_regex: "([A-Z0-9]+)"

    polling:
      default_interval: 10
      timeout: 5.0
      max_consecutive_failures: 5

    command:
      line_ending: ""
      response_timeout: 5.0
      command_delay: 0.1

  - id: jkbms_ble
    name: "JK-BMS (BLE)"
    description: "JK Battery Management System over Bluetooth LE"
    device_type: battery
    protocol_type: ble
    priority: 100
    manufacturer: "JK"
    adapter_class: "adapters.battery_jkbms_ble.JKBMSBLEAdapter"

    # BLE identification is handled differently (by advertisement name)
    identification:
      timeout: 10.0

    polling:
      default_interval: 30
      timeout: 10.0
      max_consecutive_failures: 3

  # ============================================
  # MQTT DEVICES
  # ============================================

  - id: mqtt_generic
    name: "MQTT Generic Device"
    description: "Generic MQTT-based solar device (inverter, meter, or battery)"
    device_type: inverter
    protocol_type: mqtt
    priority: 50
    adapter_class: "adapters.mqtt_adapter.MQTTAdapter"

    # MQTT identification via status topic
    identification:
      timeout: 10.0

    polling:
      default_interval: 10
      timeout: 10.0
      max_consecutive_failures: 5

    # MQTT-specific configuration
    mqtt:
      topic_prefix: "solar-hub"
      qos: 1
      keepalive: 60

# Server configuration defaults
# These can be overridden via environment variables
server:
  host: "0.0.0.0"
  port: 8502
  max_connections: 1000

connection:
  timeout: 30
  keepalive: 60

identification:
  timeout: 30
  max_retries: 3

polling:
  default_interval: 10
  min_interval: 5
  max_interval: 300
  failure_backoff: true
  max_consecutive_failures: 5
